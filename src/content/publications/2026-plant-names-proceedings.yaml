title: >-
  Regional Wanderwörter of Formosan Languages in Northwestern Taiwan: A Case
  Study of Some Plant Names
authors:
  - Samuel Yu-hsiang PAN
  - Walis Hian-chi SONG
defaultContributorPosition: 2
year:
  discriminant: year
  value: 2026
type: conference
venue: >-
  Papers from the 34th Meeting of the Southeast Asian Linguistics Society
  (2025). JSEALS Special Publication No. 14. Ed. by Mark Alves. Honolulu:
  University of Hawai‘i Press.
abstract: >-
  This study investigates the regional shared lexicon among Formosan languages,
  focusing on the distribution and interrelations of plant names in the
  northwestern region of Taiwan. Previous works by Ferrell (1969) and Li (1994)
  have compared lexical items among Formosan languages. However, the historical
  relation of these words has not received broad and systematic discussion. We
  collected data from multiple Formosan languages in northwestern Taiwan,
  including Atayal, Seediq, Pazeh-Kaxabu, Saisiyat, Bunun, Thao, Kavalan,
  Taokas, and other nearby languages. Through lexical comparison, we examined
  whether the phonological correspondences of these words align with each other.
  Despite surface-level similarities, irregular phonological patterns suggest
  these plant names are more likely “regional Wanderwörter” resulting from
  long-term language contact, rather than direct descendants of
  Proto-Austronesian (PAn) etyma. Based on distribution and historical contact
  patterns, we categorize these shared words into three groups: (1) cross-
  regional shared words, such as %BALAYAR ~ BIALAR ‘Alocasia’, %BAYLUH ~ BAWLU
  ‘beans’, %(BA)TAKAN ‘bamboo (tubes)’, %BARASIQ ~ DARESIQ ‘wax trees’,
  %QALUP(AS) ’peaches’; (2) words found in the Atayal diffusion area, such as
  %DALU ‘persimmons’, %BASAR ‘Broussonetia trees’; (3) words spreading across
  the northern coastal areas, such as %QAWPIR ‘sweet potatoes’, %SILIH ‘chili
  peppers’.Our findings suggest these shared words emerge from early language
  contact. By clarifying historical relationships within Formosan languages,
  this research provides a concrete basis for identifying regional Wanderwörter
  and offers insights into historical language interactions in northwestern
  Taiwan.
