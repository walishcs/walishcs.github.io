name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Astro
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Build production site
        run: npm run build

      - name: Diagnose Astryx integration
        run: npm run astryx -- doctor
