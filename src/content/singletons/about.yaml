heading: About Me
portrait: /images/about/portrait.jpg
biography: >-
  I am a linguist specializing in Austronesian historical linguistics, with a
  particular focus on the Seediq and Atayal (i.e. Atayalic languages). My
  research explores historical reconstruction, language change, and digital
  approaches to language documentation and education.
